name: Build Tiny Catan APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          unzip -q TinyCatanAndroid.zip -d build-src

      - name: Build APK
        working-directory: build-src/TinyCatanAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiny-Catan-APK
          path: build-src/TinyCatanAndroid/app/build/outputs/apk/debug/app-debug.apk
